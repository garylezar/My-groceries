<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f3ed">
<title>My Grocery Shop</title>
<style>
:root{--bg:#f6f3ed;--card:#fff;--ink:#242424;--muted:#777;--line:#e7e2d9;--accent:#294b3a;--soft:#e9f0eb;--danger:#a94b43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:620px;margin:auto;padding:18px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:4px}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:white}
.scanBtn{width:100%;margin:2px 0 12px;background:white;color:var(--accent);border:1px solid var(--line)}
.scanner{background:white;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px}
.hidden{display:none}.scanTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
video{width:100%;height:260px;object-fit:cover;border-radius:12px;background:#111}
#scanStatus{font-size:13px;color:var(--muted);padding:9px 2px;text-align:center}
.icon{background:white;color:var(--ink);border:1px solid var(--line);padding:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.stat b{font-size:22px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.add{display:grid;grid-template-columns:1fr 105px 52px;gap:8px;margin:12px 0}
input,select{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:13px;font-size:16px;outline:none}
.section{margin-top:18px}.section h2{font-size:15px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.item{display:flex;align-items:center;gap:11px;background:white;border:1px solid var(--line);padding:12px;border-radius:14px;margin:7px 0}
.item.done{opacity:.55}.check{width:25px;height:25px;border-radius:50%;border:2px solid #bdb7ad;display:grid;place-items:center;flex:none;background:white;color:white}.done .check{background:var(--accent);border-color:var(--accent)}.name{flex:1}.done .name{text-decoration:line-through}.price{width:78px;padding:9px!important;font-size:14px!important}.del{background:transparent;color:var(--danger);padding:6px}
.actions{display:flex;gap:8px;margin-top:12px}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,237,.94);backdrop-filter:blur(10px);padding:10px 16px env(safe-area-inset-bottom);border-top:1px solid var(--line)}
.footerin{max-width:620px;margin:auto;display:flex;justify-content:space-between;align-items:center}.total small{color:var(--muted);display:block}.total b{font-size:22px}
@media(max-width:430px){.add{grid-template-columns:1fr 85px 48px}.price{width:68px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>🛒 My Grocery Shop</h1><div class="sub">Your personal weekly shopping list</div></div><button class="icon" onclick="resetAll()">↺</button></header>

<div class="stats">
  <div class="stat"><b id="count">0</b><span>items left</span></div>
  <div class="stat"><b id="budget">$0.00</b><span>estimated / actual</span></div>
</div>

<div class="add">
  <input id="itemInput" placeholder="Add grocery item…" onkeydown="if(event.key==='Enter')addItem()">
  <select id="cat">
    <option>Fruit & Veg</option><option>Meat</option><option>Dairy</option><option>Bakery</option><option>Pantry</option><option>Frozen</option><option>Drinks</option><option>Household</option><option>Other</option>
  </select>
  <button onclick="addItem()">+</button>
</div>
<button class="scanBtn" onclick="openScanner()">📷 Scan barcode</button>
<div id="scanner" class="scanner hidden">
  <div class="scanTop"><b>Scan a product barcode</b><button class="icon" onclick="closeScanner()">✕</button></div>
  <video id="video" playsinline></video>
  <div id="scanStatus">Point your camera at a barcode.</div>
  <button class="secondary" onclick="stopScanner()">Stop camera</button>
</div>

<div id="list"></div>

<div class="actions">
<button onclick="loadWeekly()">⭐ Weekly Shop</button>
<button class="secondary" onclick="clearDone()">Clear purchased</button>
</div>
</div>

<footer><div class="footerin"><div class="total"><small>SHOPPING TOTAL</small><b id="total">$0.00</b></div><button onclick="shareList()">Share list</button></div></footer>

<script>
const KEY='my-grocery-v1';
const weekly=[
['Milk','Dairy'],['Bread','Bakery'],['Eggs','Dairy'],['Bananas','Fruit & Veg'],
['Chicken','Meat'],['Beef mince','Meat'],['Cheese','Dairy'],['Yoghurt','Dairy'],
['Potatoes','Fruit & Veg'],['Tomatoes','Fruit & Veg'],['Rice','Pantry'],['Pasta','Pantry'],
['Frozen vegetables','Frozen'],['Toilet paper','Household']
];
let items=JSON.parse(localStorage.getItem(KEY)||'[]');\nlet pendingBarcode=null;

function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function addItem(){
 const input=document.getElementById('itemInput'), name=input.value.trim();
 if(!name)return;
 const chosenCat=document.getElementById('cat').value;
 const newItem={id:Date.now()+Math.random(),name,cat:chosenCat,price:0,done:false};
 if(pendingBarcode){
   newItem.barcode=pendingBarcode;
   const savedBarcodes=JSON.parse(localStorage.getItem('my-grocery-barcodes')||'{}');
   savedBarcodes[pendingBarcode]={name,cat:chosenCat};
   localStorage.setItem('my-grocery-barcodes',JSON.stringify(savedBarcodes));
   pendingBarcode=null;
 }
 items.push(newItem);
 input.value='';save();input.focus();
}
function toggle(id){const x=items.find(i=>i.id==id);if(x)x.done=!x.done;save()}
function del(id){items=items.filter(i=>i.id!=id);save()}
function price(id,v){const x=items.find(i=>i.id==id);if(x)x.price=Math.max(0,parseFloat(v)||0);localStorage.setItem(KEY,JSON.stringify(items));calc()}
function loadWeekly(){
 const names=new Set(items.map(i=>i.name.toLowerCase()));
 weekly.forEach(([name,cat])=>{if(!names.has(name.toLowerCase()))items.push({id:Date.now()+Math.random(),name,cat,price:0,done:false})});
 save();
}
function clearDone(){items=items.filter(i=>!i.done);save()}
function resetAll(){if(confirm('Start a new grocery list?')){items=[];save()}}
function calc(){
 const total=items.reduce((s,i)=>s+(Number(i.price)||0),0);
 document.getElementById('count').textContent=items.filter(i=>!i.done).length;
 document.getElementById('budget').textContent='$'+total.toFixed(2);
 document.getElementById('total').textContent='$'+total.toFixed(2);
}
function render(){
 const root=document.getElementById('list');root.innerHTML='';
 const cats=[...new Set(items.map(i=>i.cat))];
 if(!items.length){root.innerHTML='<div class="empty">Your list is empty.<br>Tap <b>+</b> to add your first item, or use <b>Weekly Shop</b>.</div>';calc();return}
 cats.forEach(cat=>{
   const sec=document.createElement('div');sec.className='section';
   sec.innerHTML='<h2>'+cat+'</h2>';
   items.filter(i=>i.cat===cat).sort((a,b)=>a.done-b.done).forEach(i=>{
     const row=document.createElement('div');row.className='item '+(i.done?'done':'');
     row.innerHTML='<div class="check" onclick="toggle('+i.id+')">'+(i.done?'✓':'')+'</div>'+
       '<div class="name">'+esc(i.name)+'</div>'+
       '<input class="price" type="number" min="0" step="0.01" placeholder="$0" value="'+(i.price||'')+'" onchange="price('+i.id+',this.value)">'+
       '<button class="del" onclick="del('+i.id+')">×</button>';
     sec.appendChild(row);
   });root.appendChild(sec);
 });calc();
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let scanStream=null, scanTimer=null;

async function openScanner(){
  const box=document.getElementById('scanner');
  box.classList.remove('hidden');
  const status=document.getElementById('scanStatus');
  if(!('BarcodeDetector' in window)){
    status.textContent='Barcode scanning is not supported by this browser. Try opening this file in a current browser such as Chrome or Safari.';
    return;
  }
  try{
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    const video=document.getElementById('video');
    video.srcObject=scanStream; await video.play();
    status.textContent='Point your camera at the barcode…';
    scanTimer=setInterval(async()=>{
      try{
        const codes=await detector.detect(video);
        if(codes.length){
          const code=codes[0].rawValue;
          await handleBarcode(code);
        }
      }catch(e){}
    },250);
  }catch(e){
    status.textContent='Camera access was blocked. Please allow camera access and try again.';
  }
}
async function handleBarcode(code){
  stopScanner();
  const status=document.getElementById('scanStatus');

  // Check this device's saved barcode memory first.
  const saved=JSON.parse(localStorage.getItem('my-grocery-barcodes')||'{}');
  if(saved[code]){
    const remembered=saved[code];
    items.push({id:Date.now()+Math.random(),name:remembered.name,cat:remembered.cat||'Other',price:0,done:false,barcode:code});
    save();
    alert('Added from memory: '+remembered.name);
    return;
  }

  // Try Open Food Facts for product name/category.
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');
    const d=await r.json();
    if(d.status===1 && d.product){
      const product=d.product;
      const name=product.product_name || product.product_name_en || ('Barcode '+code);
      const catText=(product.categories_tags||[]).join(' ').toLowerCase();
      let cat='Other';
      if(/fruit|vegetable|produce/.test(catText))cat='Fruit & Veg';
      else if(/meat|chicken|beef|pork|fish|seafood/.test(catText))cat='Meat';
      else if(/dairy|milk|cheese|yogurt/.test(catText))cat='Dairy';
      else if(/bread|bakery/.test(catText))cat='Bakery';
      else if(/frozen/.test(catText))cat='Frozen';
      else if(/drink|beverage|water|juice/.test(catText))cat='Drinks';
      else if(/household|cleaning|paper/.test(catText))cat='Household';
      else if(/pasta|rice|cereal|sauce|snack|pantry|canned/.test(catText))cat='Pantry';
      items.push({id:Date.now()+Math.random(),name,cat,price:0,done:false,barcode:code});
      // Remember the product locally for instant future scans.
      saved[code]={name,cat};
      localStorage.setItem('my-grocery-barcodes',JSON.stringify(saved));
      document.getElementById('cat').value=cat;
      save();
      alert('Added and remembered: '+name);
    }else{
      document.getElementById('itemInput').value='';
      document.getElementById('itemInput').focus();
      alert('Barcode '+code+' was scanned, but the product was not found. Enter its name and press + to add it. The barcode can be saved to memory after naming it.');
    }
  }catch(e){
    document.getElementById('itemInput').value='Barcode '+code;
    document.getElementById('itemInput').focus();
    alert('Barcode scanned, but product lookup was unavailable. You can enter the item name manually.');
  }
}
function stopScanner(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
}
function closeScanner(){
  stopScanner();
  document.getElementById('scanner').classList.add('hidden');
}
async function shareList(){
 const text='My Grocery List\\n'+items.filter(i=>!i.done).map(i=>'- '+i.name+(i.price?' $'+Number(i.price).toFixed(2):'')).join('\\n');
 if(navigator.share){try{await navigator.share({title:'My Grocery List',text})}catch(e){}}
 else{await navigator.clipboard.writeText(text);alert('List copied to clipboard.')}
}
render();
</script>
</body>
</html>
