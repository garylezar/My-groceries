<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f67a63"><link rel="manifest" href="manifest.webmanifest"><title>My Groceries</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7f9;color:#20242a;margin:0}.app{max-width:620px;margin:auto;padding:20px 14px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:15px;margin:12px 0}button,input{font:inherit;padding:12px;border-radius:10px}button{border:0;background:#20242a;color:white;font-weight:700}.scan{width:100%;background:#f67a63;font-size:18px}input{border:1px solid #ccc;width:100%;box-sizing:border-box}.row{display:flex;gap:8px}.row input{flex:1}.item{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:12px 0}.muted{color:#68727d;font-size:13px}#scanner{position:fixed;inset:0;background:#000;z-index:5}#video{width:100%;height:100%;object-fit:cover}.top,.bottom{position:absolute;left:0;right:0;color:#fff;padding:18px}.top{top:0;display:flex;justify-content:space-between;background:#0008}.bottom{bottom:0;text-align:center;background:#0009}.close{background:#fff;color:#111}.hidden{display:none}</style><script src="https://unpkg.com/@zxing/browser@0.2.1"></script></head><body><main class="app"><h1>🛒 My Groceries</h1><button class="scan" onclick="scan()">📷 Scan barcode</button><div class="card"><div class="row"><input id="manual" placeholder="Add item manually"><button onclick="addManual()">Add</button></div></div><div class="card"><b>Running total: <span id="total">$0.00</span></b><div id="list"></div></div></main><div id="scanner" class="hidden"><div class="top"><b>Scan barcode</b><button class="close" onclick="closeScan()">Close</button></div><video id="video" playsinline muted></video><div class="bottom" id="status">Starting scanner…</div></div><script>
const LK='grocery_list_v3',PK='grocery_prices_v3';let list=JSON.parse(localStorage.getItem(LK)||'[]'),prices=JSON.parse(localStorage.getItem(PK)||'{}'),controls=null,reader=null,last='';
const $=id=>document.getElementById(id), money=n=>'$'+Number(n||0).toFixed(2);function save(){localStorage.setItem(LK,JSON.stringify(list));localStorage.setItem(PK,JSON.stringify(prices));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){$('total').textContent=money(list.reduce((a,x)=>a+Number(x.price||0),0));$('list').innerHTML=list.length?list.map((x,i)=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${x.barcode||'Manual'}</div></div><div><b>${money(x.price)}</b> <button onclick="list.splice(${i},1);save()">✕</button></div></div>`).join(''):'<p class="muted">Your list is empty.</p>'}function addManual(){let n=$('manual').value.trim();if(!n)return;let p=prompt('Price for '+n,'');if(p===null)return;list.push({name:n,price:Number(p)||0});$('manual').value='';save()}
async function productName(code){try{let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json');let d=await r.json();return d.status===1?(d.product.product_name||d.product.product_name_en||null):null}catch(e){return null}}
async function got(code){closeScan();let old=prices[code];let name=old?.name||await productName(code)||prompt('Product name for barcode '+code,'Scanned product');if(!name)return;let def=old?.price??'';let p=prompt('Price for '+name+(old?'\nLast price: '+money(old.price):''),def);if(p===null)return;p=Number(String(p).replace(',','.'));if(!isFinite(p)||p<0){alert('Enter a valid price.');return}prices[code]={name,price:p};list.push({name,barcode:code,price:p});save()}
async function scan(){let s=$('scanner');s.classList.remove('hidden');$('status').textContent='Starting camera…';if(!window.ZXingBrowser){$('status').textContent='Scanner library failed to load. Check internet and retry.';return}try{reader=new ZXingBrowser.BrowserMultiFormatReader();let ds=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();let back=ds.find(d=>/back|rear|environment/i.test(d.label))||ds[ds.length-1];controls=await reader.decodeFromVideoDevice(back?.deviceId,$('video'),(result,error,c)=>{controls=c;if(result){let code=result.getText();if(code&&code!==last){last=code;got(code)}}});$('status').textContent='Point the rear camera at the barcode…'}catch(e){console.error(e);$('status').textContent='Camera could not start. Check Safari camera permission.'}}
function closeScan(){try{controls?.stop()}catch(e){}try{reader?.reset()}catch(e){}controls=null;reader=null;$('video').srcObject=null;$('scanner').classList.add('hidden');last=''}render();</script></body></html>
